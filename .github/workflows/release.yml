name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (if secret present)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Release APK & AAB
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE || (env.KEYSTORE_BASE64 != '' && 'release.keystore' || '') }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Determine APK path
        id: find-apk
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "aab_path=app/build/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
            ${{ steps.find-apk.outputs.aab_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
