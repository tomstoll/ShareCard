name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided repository keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias sharecard \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ShareCard, OU=ShareCard, O=ShareCard, C=US" \
              -storepass sharecard123 \
              -keypass sharecard123
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sharecard123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sharecard' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sharecard123' }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare-artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_NAME="ShareCard-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.prepare-artifacts.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
