Name: ShareCard
Summary: 100% offline, privacy-first digital business card & QR/NFC contact sharing
Description: |-
  ShareCard is an open-source, 100% offline, privacy-first Android digital
  business card and contact-sharing application built with Kotlin and Jetpack Compose.

  Guarantees:
  * Zero Internet Permission: android.permission.INTERNET is never declared.
  * Single Permission: android.permission.NFC (normal permission, silent install).
  * Zero Storage Permissions: Uses Storage Access Framework (SAF) for backups.
  * Zero Settings Permissions: Brightness boost is window-local.

  Features:
  * Dynamic QR Code Generator (vCard 3.0, Wi-Fi, URL, Text)
  * Physical NFC Tag Writer (NDEF text/vCard & URI with byte capacity counter)
  * Jetpack Glance Home Screen Widget with translucent QR viewer
  * 1-Tap Autofill & International Country Code dialer
  * Flexible International Address Form (UPU S42 & RFC 2426 ADR)
  * Material You dynamic theming and Pure OLED dark mode

